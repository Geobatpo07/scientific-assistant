version: "3.9"

services:
  api:
    build: .
    container_name: teslas_api
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=false
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=phi
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma
      - ./data:/app/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: teslas_ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_THREADS=6
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 10g
    restart: unless-stopped

volumes:
  chroma_data:
  data_volume:
  ollama_models:
