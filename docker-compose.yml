services:
  api:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    container_name: teslas_api
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=false
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=phi
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma
      - ./data:/app/data
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: app/ui/Dockerfile
    container_name: teslas_ui
    command: >-
      streamlit run app/ui/streamlit_app.py
      --server.port=8501
      --server.address=0.0.0.0
      --browser.gatherUsageStats=false
    environment:
      - TESLAS_API_URL=http://api:8000/api
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: teslas_ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_THREADS=6
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 10g
    restart: unless-stopped

volumes:
  chroma_data:
  ollama_models:
