[project]
name = "scientific-assistant"
version = "0.1.0"
description = "A high-level scientific assistant for applied mathematics and data science"
requires-python = ">=3.12"
readme = "README.md"
authors = [
    {name = "Geobatpo07"}
]
keywords = [
    "mathematics",
    "data-science",
    "scientific-computing",
    "numerical-analysis",
    "machine-learning"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "sympy>=1.12",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "jupyter>=1.0.0",
    "ipython>=8.18.0",
]

[project.scripts]
scientific-assistant = "scientific_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scientific_assistant"]
