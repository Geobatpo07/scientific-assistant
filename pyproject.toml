[project]
name = "scientific-assistant"
version = "0.2.0"
description = "A multi-agent local scientific assistant for applied mathematics and data science research"
requires-python = ">=3.11,<3.13"
readme = "README.md"

authors = [{ name = "Geobatpo07" }]

keywords = [
    "mathematics",
    "data-science",
    "scientific-computing",
    "multi-agent",
    "rag",
    "llm",
    "research",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# ============================================================
# CORE DEPENDENCIES (CPU-ONLY, DOCKER-SAFE)
# ============================================================

dependencies = [
    # --- LLM & Multi-Agent ---
    "langchain>=0.1.0",
    "langgraph>=0.0.1",
    "ollama>=0.1.0",

    # --- Vector Store & Embeddings ---
    "chromadb>=0.4.0",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.0",

    # FORCE PYTORCH CPU-ONLY (CRITICAL)
    "torch>=2.1.0,<2.3.0",

    # --- FastAPI & Web ---
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",

    # --- Streamlit UI ---
    "streamlit>=1.28.0",

    # --- Document Processing ---
    "unstructured[pdf]>=0.11.0",
    "pypdf>=3.17.0",
    "pillow>=10.0.0",

    # --- Scientific Computing ---
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "sympy>=1.12",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",

    # --- Data Processing ---
    "pandas>=2.1.0",

    # --- Visualization ---
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.17.0",

    # --- Web Search ---
    "duckduckgo-search>=3.9.0",
    "ddgs>=9.10.0",

    # --- Configuration & Utils ---
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "requests>=2.32.5,<3.0.0",

    # --- Logging ---
    "loguru>=0.7.0",

    # --- LangChain Ecosystem ---
    "langchain-community>=0.4.1",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.2.5",
    "langchain-ollama>=1.0.1",
]

# ============================================================
# DEVELOPMENT DEPENDENCIES
# ============================================================

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "jupyter>=1.0.0",
    "ipython>=8.18.0",
]

# ============================================================
# CLI SCRIPTS
# ============================================================

[project.scripts]
teslas-ai = "scripts.run_local:main"
teslas-ingest = "scripts.ingest_docs:main"
teslas-reset = "scripts.reset_db:main"

# ============================================================
# BUILD SYSTEM
# ============================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ============================================================
# UV CONFIGURATION (TARGETED SOURCE, SAFE)
# ============================================================

[tool.uv.sources]
pytorch-cpu = { url = "https://download.pytorch.org/whl/cpu" }

# ============================================================
# TOOLING CONFIG
# ============================================================

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
